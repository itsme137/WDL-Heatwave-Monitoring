<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscribe | Heatwave Intelligence System (Bootstrap)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-danger">
 <div class="container"><a class="navbar-brand fw-bold" href="index.html">Heatwave Intelligence System</a></div>
</nav>

<main class="container my-4">
 <div class="row justify-content-center">
   <div class="col-lg-7">
    <div class="card shadow-sm">
     <div class="card-header bg-danger text-white fw-semibold">Citizen Advisory Subscription</div>
     <div class="card-body">
      <form action="#" method="post">
       <div class="mb-3">
         <label for="cname" class="form-label">Full Name</label>
         <input type="text" class="form-control" id="cname" placeholder="Enter your full name" required>
       </div>
       <div class="row g-3 mb-3">
         <div class="col-md-6">
          <label for="cemail" class="form-label">Email Address</label>
          <input type="email" class="form-control" id="cemail" placeholder="you@example.com" required>
         </div>
         <div class="col-md-6">
          <label for="cmobile" class="form-label">Mobile Number</label>
          <input type="tel" class="form-control" id="cmobile" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
         </div>
       </div>
       <div class="mb-3">
         <label for="region" class="form-label">Region</label>
         <select class="form-select" id="region" required>
          <option value="">-- Select your region --</option>
          <option>North Zone</option><option>Central Zone</option>
          <option>Coastal Zone</option><option>Western Ghats Zone</option>
         </select>
       </div>
       <fieldset class="mb-3">
         <legend class="fs-6 fw-semibold">Preferred Alert Language</legend>
         <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="language" id="l1" checked><label class="form-check-label" for="l1">English</label></div>
         <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="language" id="l2"><label class="form-check-label" for="l2">Hindi</label></div>
         <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="language" id="l3"><label class="form-check-label" for="l3">Marathi</label></div>
       </fieldset>
       <fieldset class="mb-4">
        <legend class="fs-6 fw-semibold">Alert Types to Receive</legend>
        <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="a1"><label class="form-check-label" for="a1">SMS</label></div>
        <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="a2"><label class="form-check-label" for="a2">Email</label></div>
        <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="a3"><label class="form-check-label" for="a3">Push</label></div>
       </fieldset>
       <button type="submit" class="btn btn-danger me-2">Submit</button>
       <button type="reset" class="btn btn-outline-secondary">Reset</button>
      </form>
    </div>
   </div>
  </div>
 </div>
</main>

<footer class="bg-dark text-white-50 text-center py-3 mt-4">
 <small>&copy; 2026 Heatwave Intelligence System &middot; KJSCES-01</small>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
